# Sample configuration for MailAggregator.
# Copy to config.ini and adjust values. Lines starting with "#" are comments.

[general]
# Poll interval in seconds between sync loops.
poll_seconds = 60

# Log level: DEBUG, INFO, WARNING, ERROR
log_level = INFO

# Optional env file loaded at startup. Relative paths resolve from config.ini.
# For systemd deployments, prefer an absolute path under /var/lib/mailfetcher.
env_file = /var/lib/mailfetcher/secrets.env

# Create destination Gmail labels if missing.
create_labels = yes


# One or more Gmail destination profiles.
# Each src_* section will reference one of these by name.
# These profiles use the Gmail API OAuth files, not IMAP app passwords.
[gmail_user_a]
username = your.user.a@gmail.com
# Required: relative paths resolve from the config.ini directory.
credentials_file = GMAIL_API/credentials.json
token_file = GMAIL_API/token-user-a.json


[gmail_user_b]
username = your.user.b@gmail.com
credentials_file = GMAIL_API/credentials.json
token_file = GMAIL_API/token-user-b.json


# One or more source mailboxes to pull from.
# Each source is mapped to a Gmail profile and destination labels.
[src_001]
source_host = imap.mxroute.com
source_port = 993
source_username = info@test.com

# Preferred: reference env var (secrets.env).
source_password_env = SRC_001_PASSWORD

# Optional plain text fallback (not recommended).
# source_password = your-plain-text-password

source_folder = INBOX
dest_profile = gmail_user_a
# Comma-separated labels. Include \Inbox to force Inbox.
# Leave empty to default to the source email address.
dest_folder = \Inbox, Imported/test.com/info


[src_002]
source_host = imap.mxroute.com
source_port = 993
source_username = support@test2.com
source_password_env = SRC_002_PASSWORD
source_folder = INBOX
dest_profile = gmail_user_b
# Comma-separated labels. Include \Inbox to force Inbox.
# Leave empty to default to the source email address.
dest_folder = Imported/test2.com/support, Important
